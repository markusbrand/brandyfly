name: OpenSpec Sync

on:
  push:
    paths:
      - 'openspec/specs/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    permissions:
      contents: write
      issues: write
    uses: markusbrand/openspec-workflows/.github/workflows/sync-specs.yml@v1
    secrets:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
