name: brandyfly
description: "A local-first paragliding vario for Android and iOS."
publish_to: 'none'
version: 0.15.0+16

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  brandyfly_native:
    path: ../../plugins/brandyfly_native
  maplibre: 0.3.6
  http: ^1.6.0
  path_provider: ^2.1.6
  crypto: ^3.0.7
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  maplibre_platform_interface: ^0.3.6
  integration_test:
    sdk: flutter
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/sample_flights/Krippenstein-Aussee.IGC
    - assets/map_styles/alpine_relief.json
    - assets/map_data/global_overview.pmtiles
    - assets/map_data/catalog.json
  fonts:
    - family: BarlowSemiCondensed
      fonts:
        - asset: assets/fonts/BarlowSemiCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowSemiCondensed-Bold.ttf
          weight: 700
