name: brandyfly
description: "A local-first paragliding vario for Android and iOS."
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.2
  brandyfly_native:
    path: ../../plugins/brandyfly_native
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  http: ^1.6.0
  path_provider: ^2.1.6
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sample_flights/Krippenstein-Aussee.IGC
