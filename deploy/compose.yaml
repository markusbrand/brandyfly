services:
  backend:
    image: ghcr.io/markusbrand/brandyfly-backend:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - backend-data:/var/lib/brandyfly
    ports:
      - "${BRANDYFLY_HOST_PORT:-8090}:8080"
    environment:
      - BRANDYFLY_LISTEN_ADDRESS=${BRANDYFLY_LISTEN_ADDRESS:-:8080}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "/brandyfly-backend", "-healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  backend-data:
