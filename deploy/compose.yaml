services:
  backend:
    build:
      context: ../services/backend
    image: brandyfly-backend:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - backend-data:/var/lib/brandyfly
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.50
    healthcheck:
      test: ["CMD", "/brandyfly-backend", "-healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  backend-data:
