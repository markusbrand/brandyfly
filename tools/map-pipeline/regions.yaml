    osmSource: "europe/croatia"
    geofabrikUrl: "https://download.geofabrik.de/europe/croatia-latest.osm.pbf"

  - id: turkey-aegean
    name: "Turkey - Aegean & Mediterranean"
    description: "SW Turkey coast and mountains (Oludeniz, Kas, Babadag, Pamukkale)"
    bounds:
      north: 38.5
      south: 36.0
      west: 27.0
      east: 31.0
    overlapKm: 20
    osmSource: "europe/turkey"
    geofabrikUrl: "https://download.geofabrik.de/europe/turkey-latest.osm.pbf"

  - id: carpathians
    name: "Carpathians"
    description: "Romania, Slovakia, southern Poland (High Tatras, Brasov, Parang)"
