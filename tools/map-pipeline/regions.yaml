fallback:
  id: global-overview
  name: "Global Overview Fallback"
  description: "Bundled low-zoom global overview vector tiles (zoom 0-6) from Natural Earth"
  maxSizeBytes: 5242880 # 5 MB max target
  minZoom: 0
  maxZoom: 6
